name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/*.sh hooks/*.sh && ./scripts/package-plugin.sh
      - run: cd dist && zip -r "witness-plugin_${GITHUB_REF_NAME#v}.zip" plugin
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/witness-plugin_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
